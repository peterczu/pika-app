<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Pika App</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f4f8; }
    .box { text-align: center; background: white; padding: 40px 60px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }

    p { color: #7a7065; }

</head>
<body>
  <div class="box">
    <h1>Hello World! 👋</h1>
    <p>Pika App is running successfully</p>

</html>
