
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pika — Staging</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .badge {
      display: inline-block;
      background: #f59e0b;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 10px 20px;
      border-radius: 999px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 12px;
      color: #111827;
    }

    .subtitle {
      font-size: 20px;
      color: #6b7280;
      margin-bottom: 36px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 30px;
    }

    .card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px 12px;
    }

    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .value {
      font-size: 16px;
      font-weight: 700;
      color: #374151;
    }

    .footer {
      margin-top: 36px;
      font-size: 13px;
      color: #9ca3af;
    }

    @media (max-width: 600px) {
      .container {
        padding: 32px 20px;
      }

      h1 {
        font-size: 36px;
      }

      .info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="badge">
      STAGING ENVIRONMENT
    </div>

    <h1>Pika</h1>

    <p class="subtitle">
      This application is running in the staging environment.
    </p>

    <section class="info">

      <div class="card">
        <div class="label">Project</div>
        <div class="value">Pika</div>
      </div>

      <div class="card">
        <div class="label">Environment</div>
        <div class="value">Staging</div>
      </div>

      <div class="card">
        <div class="label">Deployment</div>
        <div class="value">ECS Fargate</div>
      </div>

    </section>

    <p class="footer">
      Pika · Staging Infrastructure
    </p>

  </main>

</body>
</html>
